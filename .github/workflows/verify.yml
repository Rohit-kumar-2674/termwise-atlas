name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scripts:
    name: Scripts (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s examples/python-lab -v
      - run: python scripts/doctor.py --json --require python --require git
      - run: python scripts/wizard.py --platform android --goal cloud --ram 4 --json
  docs:
    name: Content, site, and browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.lock
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/react-checklist/package-lock.json
      - run: python -m pip install -r requirements-docs.lock
      - run: python -m ruff check scripts tests examples/python-lab
      - run: python scripts/validate.py
      - run: python -m mkdocs build --strict
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix examples/react-checklist
      - run: npm test --prefix examples/react-checklist
      - run: npm run build --prefix examples/react-checklist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: .qa/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: documentation-site
          path: site/
  docker:
    name: Container preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
      - run: docker build -t termwise-atlas:test .
      - run: docker run -d --name atlas --read-only --cap-drop ALL --security-opt no-new-privileges --publish 127.0.0.1:8080:8000 termwise-atlas:test
      - name: Wait for the preview to serve its homepage
        # Docker can reset a forwarded connection before Python starts listening.
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 1 --max-time 5 --retry-max-time 30 http://127.0.0.1:8080/ --output /tmp/atlas-preview.html
          python -c "from pathlib import Path; assert 'Termwise Atlas' in Path('/tmp/atlas-preview.html').read_text()"
      - name: Show container logs on failure
        if: failure()
        run: docker logs atlas
      - run: docker rm -f atlas
        if: always()
