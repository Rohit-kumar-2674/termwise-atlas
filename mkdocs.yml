site_name: Termwise Atlas
site_description: One open guide to AI coding from any terminal, on any device.
site_url: https://rohit-kumar-2674.github.io/termwise-atlas/
repo_url: https://github.com/Rohit-kumar-2674/termwise-atlas
repo_name: Rohit-kumar-2674/termwise-atlas
edit_uri: edit/main/docs/
copyright: Independent community guide · MIT · Source review and runtime coverage are separate.
strict: true
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - assets/atlas.css
extra_javascript:
  - assets/route-engine.js
  - assets/atlas.js
extra:
  generator: false
nav:
